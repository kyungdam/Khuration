<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6A0F2A">
<title>KHURATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
:root{--b:#8A1538;--bt:#F5E8EB;--ink:#231519;--ink2:#5E4E53;--ink3:#786A6E;--line:#EDE3E6;--field:#E6D9DD;--bg:#FAF7F5;--top:52px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#1E1416;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
#frame{position:relative;flex-shrink:0;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 10px #0E0A0B,0 30px 80px rgba(0,0,0,.55);transform-origin:center center}
#restart{position:fixed;right:16px;bottom:16px;height:36px;padding:0 14px;border-radius:18px;border:1px solid rgba(255,255,255,.18);background:transparent;color:rgba(255,255,255,.6);font:500 12px 'Noto Sans KR',sans-serif;cursor:pointer}
#restart:hover{color:#fff;border-color:rgba(255,255,255,.4)}
@media (max-width:520px){
  body{background:var(--bg);display:block}
  #frame{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none;transform:none!important}
  #restart{display:none}
  :root{--top:20px}
}
a{color:inherit;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
input::placeholder,textarea::placeholder{color:var(--ink3)}
.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ns{scrollbar-width:none}.ns::-webkit-scrollbar{display:none}
.serif{font-family:'Hahmlet','Noto Serif KR','Nanum Myeongjo',Batang,Georgia,serif}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.scr.enter{animation:enter .2s ease-out}
@keyframes enter{from{opacity:.35;transform:translateX(10px)}to{opacity:1;transform:none}}
.main{flex:1;min-height:0;overflow-y:auto;padding:var(--top) 24px 16px;display:flex;flex-direction:column}
.main>*{flex-shrink:0}
.nav{height:84px;flex-shrink:0;padding:6px 8px 22px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);font-size:11px;font-weight:500}
.nav a.on{color:var(--b);font-weight:700}
.aib{width:28px;height:28px;border-radius:14px;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center}
.ib{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:22px;padding:0;color:var(--ink)}
.lbl{font-size:12px;line-height:18px;font-weight:600;color:var(--ink2)}
.fld{display:flex;flex-direction:column;gap:6px}
.inp{width:100%;height:44px;border:1px solid var(--field);border-radius:12px;background:#fff;padding:0 14px;font-size:15px;color:var(--ink);outline:none;transition:border-color .15s}
.inp:focus{border-color:var(--b)}
.inp.bad{border-color:#D92D20}
.req{color:var(--b);margin-left:2px}
.emsg{display:none;font-size:12px;line-height:16px;color:#B42318;font-weight:500}
.rq.err .emsg{display:block}
.rq.err .seg:not(.on),.rq.err .chip:not(.on){border-color:#D92D20}
.chip{height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--field);background:#fff;color:var(--ink2);font-size:14px;font-weight:500;display:flex;align-items:center;gap:4px;flex-shrink:0}
.chip.on{border-color:var(--b);background:var(--b);color:#fff;font-weight:600;padding:0 12px}
.seg{height:44px;border-radius:12px;border:1px solid var(--field);background:#fff;font-size:14px;font-weight:500;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg.on{border:1.5px solid var(--b);background:var(--bt);color:var(--b);font-weight:700}
.btnp{width:100%;height:52px;border-radius:14px;border:none;background:var(--b);color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:700}
.btno{height:52px;border-radius:14px;border:1.5px solid var(--b);background:#fff;color:var(--b);display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:16px}
.badge{height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;flex-shrink:0}
.b-fill{background:var(--b);color:#fff}.b-tint{background:var(--bt);color:var(--b)}.b-line{background:#fff;color:var(--b);box-shadow:inset 0 0 0 1px #E2CCD3}
.tag{height:22px;padding:0 8px;border-radius:6px;background:var(--bt);color:var(--b);font-size:11px;font-weight:700;display:inline-flex;align-items:center;flex-shrink:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{position:relative;width:44px;height:26px;border-radius:13px;border:none;padding:0;background:#9C8A90;transition:background .15s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .15s}
.sw.on{background:var(--b)}.sw.on::after{left:21px}
.toast{position:absolute;left:24px;right:24px;bottom:108px;z-index:50;padding:13px 16px;border-radius:14px;background:rgba(35,21,25,.92);color:#fff;font-size:14px;font-weight:500;text-align:center;box-shadow:0 8px 24px rgba(35,21,25,.2);animation:fadeup .2s ease-out}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
.dot{width:6px;height:6px;border-radius:3px;background:var(--b);animation:dot 1.1s infinite ease-in-out}
.msg-in{animation:fadeup .25s ease-out}
@keyframes slidein{from{transform:translateX(-24px);opacity:.6}to{transform:none;opacity:1}}
/* loading & error states */
.skel{border-radius:16px;background:linear-gradient(90deg,#F1E8EA 0%,#F8F2F3 50%,#F1E8EA 100%);background-size:200% 100%;animation:skel 1.2s infinite linear}
@keyframes skel{from{background-position:200% 0}to{background-position:-200% 0}}
.errbox{padding:28px 16px;background:#fff;border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
#mode{position:fixed;left:16px;bottom:16px;height:28px;padding:0 10px;border-radius:14px;display:flex;align-items:center;font:500 11px 'Noto Sans KR',sans-serif;color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.15)}
@media (max-width:520px){#mode{display:none}}
</style>
</head>

<!-- 순서 중요: 설정 → 목업 서버 → API 클라이언트 → 화면 -->
<script>
/*
 * KHURATION 프론트엔드 설정
 *
 * USE_MOCK
 *   true  → js/mock-api.js 의 예시 데이터로 동작 (백엔드 없이 시연용)
 *   false → API_BASE 의 실제 서버(FastAPI, backend/)로 요청 — 기본값
 *
 * 주소창 파라미터로도 바꿀 수 있어요.
 *   index.html?mock=1                         → 목업 모드 (서버 없이 화면만 볼 때)
 *   index.html?api=http://192.168.0.12:8000   → 다른 주소의 서버로 요청
 *   서버가 이 파일을 /web/ 으로 내려주므로 기본 API_BASE 는 같은 주소('')예요.
 */
(function () {
  var params = new URLSearchParams(window.location.search);
  var config = {
    USE_MOCK: false,
    API_BASE: '',

    // 목업 모드에서만 '오늘'로 쓰는 날짜. 실서버 모드에서는 기기의 실제 날짜를 씁니다.
    MOCK_TODAY: '2026-10-26',
    // 목업 응답을 실제 네트워크처럼 살짝 늦게 돌려줄 시간(ms)
    MOCK_LATENCY_MS: 120,
    // 챗봇 '입력 중…' 표시를 최소 이 시간만큼 보여줌(ms)
    CHAT_TYPING_MIN_MS: 700
  };
  if (params.has('mock')) config.USE_MOCK = params.get('mock') !== '0';
  if (params.has('api')) config.API_BASE = params.get('api').replace(/\/$/, '');
  window.KHU_CONFIG = config;
})();
</script>

    if (p.credits >= 0 && p.credits <= 200) t.credits_floor = Math.floor(p.credits / 10) * 10;
    if (p.incomeBracket >= 1 && p.incomeBracket <= 10) t.income_band = p.incomeBracket;
    t.interests = INTERESTS.filter(function (x) { return (p.interests || []).indexOf(x[0]) >= 0; }).map(function (x) { return x[1]; });
    return t;
  }

  /* ---------- HTTP ---------- */
  function deviceToken() {
    var t = store.get('device', null);
    if (!t) {
      var rnd = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
      t = 'web-' + rnd;
      store.set('device', t);
    }
    return t;
  }
  function qs(params) {
    var parts = [];
    Object.keys(params || {}).forEach(function (k) {
      var v = params[k];
      if (v === undefined || v === null || v === '') return;
      parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
    });
    return parts.length ? '?' + parts.join('&') : '';
  }
  async function raw(method, path, body) {
    var headers = { Accept: 'application/json', 'X-Device-Token': deviceToken() };
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    var res;
    try {
      res = await fetch(C.API_BASE + path, { method: method, headers: headers, body: body !== undefined ? JSON.stringify(body) : undefined });
    } catch (e) {
      throw new ApiError(0, '서버에 연결할 수 없어요');
    }
    if (!res.ok) {
      var msg = method + ' ' + path + ' → ' + res.status;
      try { var j = await res.json(); if (j && j.detail) msg = typeof j.detail === 'string' ? j.detail : msg; } catch (e) { /* 본문 없음 */ }
      throw new ApiError(res.status, msg);
    }
    var text = await res.text();
    return text ? JSON.parse(text) : null;
  }
  async function register() {
    var p = store.get('profile', null);
    if (!p) throw new ApiError(404, '먼저 내 정보를 입력해 주세요');
    await raw('POST', '/devices', { push_token: deviceToken(), tags: toTags(p) });
    if (p.goal) { try { await raw('POST', '/devices/intent', { text: p.goal.slice(0, 500) }); } catch (e) { /* 키워드는 선택 */ } }
  }
  /** 서버 DB가 초기화돼 기기 등록이 사라졌으면(404) 한 번 다시 등록하고 재시도 */
  async function http(method, path, body) {
    try { return await raw(method, path, body); } catch (e) {
      if (e.status !== 404 || !/등록되지 않은 기기/.test(e.message) || !store.get('profile', null)) throw e;
      await register();
      return raw(method, path, body);
    }
  }

  /* ---------- 서버 응답 → 화면 모양 ---------- */
  var ST = { match: ['MET', '충족'], mismatch: ['UNMET', '미충족'], check: ['CHECK', '확인 필요'] };
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function ddays(iso) { return iso ? Math.round((new Date(iso + 'T00:00:00') - today()) / 86400000) : null; }
  function progress(id) {
    if (!store.get('calendar', {})[id]) return null;
    var items = ensureChecklist(id).items;
    return { done: items.filter(function (i) { return i.done; }).length, total: items.length };
  }
  function reasonOf(it) {
    var p = store.get('profile', null) || {};
    var mine = toTags(p).interests;
    var hit = (it.topics || []).filter(function (k) { return mine.indexOf(k) >= 0; }).map(function (k) { return TOPIC_LABEL[k]; });
    var met = (it.reasons || []).filter(function (r) { return r.status === 'match'; }).map(function (r) { return r.requirement; });
    var parts = [];
    if (hit.length) parts.push('관심 분야 ' + hit.join('·') + ' 일치');
    if (met.length) parts.push(met.slice(0, 2).join(' · ') + ' 충족');
    if (it.status === 'check') parts.push('일부 조건 확인 필요');
    return parts.join(' · ') || null;
  }
  function toSummary(it) {
    var bad = (it.reasons || []).filter(function (r) { return r.status === 'mismatch'; })[0];
    return {
      id: String(it.id), category: it.category, title: it.title, organizer: it.source,
      source: { name: it.source, type: 'UNIVERSITY', url: it.url },
      postedAt: it.posted_date, deadline: it.deadline_date,
      status: it.status, eligible: it.status !== 'mismatch',
      eligibilityNote: bad ? bad.requirement + ' · ' + bad.note : null,
      recommendReason: reasonOf(it), aiScore: it.interest_score,
      bookmarked: !!store.get('bookmarks', {})[it.id], onCalendar: !!store.get('calendar', {})[it.id],
      checklist: progress(String(it.id))
    };
  }
  function remember(d) {
    var cache = store.get('notices', {});
    cache[d.id] = { title: d.title, deadline: d.deadline, category: d.category, organizer: d.organizer, checklist: d.serverChecklist };
    store.set('notices', cache);
  }
  function toDetail(n) {
    var d = toSummary(n);
    d.summary = (n.summary_points && n.summary_points.length) ? n.summary_points : (n.summary ? [n.summary] : ['요약이 아직 없어요. 원문을 확인해 주세요.']);
    d.fit = (n.reasons || []).map(function (r) {
      var s = ST[r.status] || ST.check;
      return { label: r.requirement, status: s[0], statusText: r.status === 'check' && /정보 없음/.test(r.note) ? '정보 없음' : s[1] };
    });
    if (!d.fit.length) d.fit = [{ label: '지원 자격 (공지에 조건 표시 없음)', status: 'CHECK', statusText: '원문 확인' }];
    d.originalUrl = n.url;
    d.applyUrl = n.apply_url || n.url;
    d.serverChecklist = n.checklist || [];
    remember(d);
    return d;
  }
  async function noticeInfo(id) {
    var info = store.get('notices', {})[id];
    if (!info) { await ServerApi.getNotice(id); info = store.get('notices', {})[id]; }
    return info;
  }
  function ensureChecklist(id) {
    var all = store.get('checklists', {});
    if (!all[id]) {
      var info = store.get('notices', {})[id] || {};
      var labels = (info.checklist && info.checklist.length) ? info.checklist : GENERIC_CHECKLIST;
      all[id] = { items: labels.map(function (label, i) { return { id: 'c' + (i + 1), label: label, done: false }; }), alarm: { enabled: true, daysBefore: [3, 1] } };
      store.set('checklists', all);
    }
    return all[id];
  }
  function saveChecklist(id, c) { var all = store.get('checklists', {}); all[id] = c; store.set('checklists', all); }
  function toChecklist(id) {
    var info = store.get('notices', {})[id] || {};
    var c = ensureChecklist(id);
    return { noticeId: id, title: info.title, organizer: info.organizer, deadline: info.deadline, items: c.items, alarm: c.alarm };
  }

  var ServerApi = {
    getMeta: async function () { return META; },
    getProfile: async function () { return store.get('profile', null); },
    saveProfile: async function (p) {
      store.set('profile', p);
      await register();
      return p;
    },

    getRecommendations: async function () {
      var list = (await http('GET', '/feed')).map(toSummary);
      var top = list.filter(function (n) { return n.status === 'match'; })[0] || list[0] || null;
      return { top: top, items: list.filter(function (n) { return n !== top; }).slice(0, 4) };
    },

    listNotices: async function (query) {
      query = query || {};
      var list = (await http('GET', '/notices' + qs({ q: query.q, category: query.category, sort: query.sort }))).map(toSummary);
      if (String(query.eligibleOnly) === 'true') list = list.filter(function (n) { return n.eligible; });
      if (query.sort === 'deadline') list = list.filter(function (n) { return n.deadline; });
      var total = list.length;
      if (query.limit) list = list.slice(0, Number(query.limit));
      return { items: list, total: total };
    },

    getNotice: async function (id) { return toDetail(await http('GET', '/notices/' + encodeURIComponent(id))); },

    setBookmark: async function (id, on) {
      var b = store.get('bookmarks', {});
      if (on) b[id] = true; else delete b[id];
      store.set('bookmarks', b);
      return null;
    },

    addToCalendar: async function (id) {
      var info = await noticeInfo(id);
      if (!info || !info.deadline) throw new ApiError(422, '마감일이 정해지지 않은 공지는 캘린더에 넣을 수 없어요');
      var cal = store.get('calendar', {});
      cal[id] = true;
      store.set('calendar', cal);
      ensureChecklist(id);
      return { noticeId: id, date: info.deadline, category: info.category, title: info.title, checklist: progress(id) };
    },

    getCalendar: async function (from, to) {
      var cal = store.get('calendar', {});
      var cache = store.get('notices', {});
      var events = Object.keys(cal).map(function (id) {
        var n = cache[id];
        return n && n.deadline ? { noticeId: id, date: n.deadline, category: n.category, title: n.title, checklist: progress(id) } : null;
      }).filter(function (e) { return e && e.date >= from && e.date <= to; })
        .sort(function (a, b) { return a.date > b.date ? 1 : -1; });
      return { events: events };
    },

    getChecklist: async function (id) {
      if (!store.get('calendar', {})[id]) throw new ApiError(404, '캘린더에 저장한 공지만 체크리스트가 있어요');
      return toChecklist(id);
    },
    setChecklistItem: async function (id, itemId, done) {
      var c = ensureChecklist(id);
      c.items.forEach(function (i) { if (i.id === itemId) i.done = !!done; });
      saveChecklist(id, c);
      return toChecklist(id);
    },
    setAlarm: async function (id, enabled) {
      var c = ensureChecklist(id);
      c.alarm.enabled = !!enabled;
      saveChecklist(id, c);
      return toChecklist(id);
    },

    /** 앱 안 알림: 캘린더에 저장했고 알림이 켜진 공지 중 마감 3일 이내 */
    getUnreadCount: async function () {
      var cal = store.get('calendar', {});
      var cache = store.get('notices', {});
      var count = Object.keys(cal).filter(function (id) {
        var d = cache[id] ? ddays(cache[id].deadline) : null;
        return d !== null && d >= 0 && d <= 3 && ensureChecklist(id).alarm.enabled;
      }).length;
      return { count: count };
    },

    listThreads: async function () {
      var ts = store.get('threads', []).slice().sort(function (a, b) { return a.updatedAt < b.updatedAt ? 1 : -1; });
      return { threads: ts };
    },
    getThreadMessages: async function (threadId) {
      var msgs = store.get('messages', {})[threadId];
      if (!msgs) throw new ApiError(404, '대화를 찾을 수 없어요');
      return { threadId: threadId, messages: msgs };
    },
    chat: async function (message, threadId) {
      var r = await http('POST', '/ai/chat', { message: message.slice(0, 500) });
      var reply = { text: r.answer, highlight: null, cards: (r.items || []).map(toSummary), followUp: null, actions: [], sources: r.sources || [] };
      var now = new Date().toISOString();
      var threads = store.get('threads', []);
      var all = store.get('messages', {});
      if (!threadId) {
        threadId = 'T-' + Date.now();
        threads.push({ id: threadId, title: message.slice(0, 24), updatedAt: now });
      } else {
        threads.forEach(function (t) { if (t.id === threadId) t.updatedAt = now; });
      }
      (all[threadId] = all[threadId] || []).push({ role: 'user', text: message }, { role: 'assistant', reply: reply });
      threads = threads.sort(function (a, b) { return a.updatedAt < b.updatedAt ? 1 : -1; }).slice(0, 30);
      Object.keys(all).forEach(function (k) { if (!threads.some(function (t) { return t.id === k; })) delete all[k]; });
      store.set('threads', threads);
      store.set('messages', all);
      return { threadId: threadId, reply: reply };
    },

    /** 내 데이터 삭제: 서버의 익명 태그 + 이 기기 저장분 */
    deleteMyData: async function () {
      try { await raw('DELETE', '/devices'); } catch (e) { /* 이미 없음 */ }
      ['profile', 'bookmarks', 'calendar', 'checklists', 'threads', 'messages', 'notices', 'device'].forEach(function (k) {
        delete MEM[k];
        try { localStorage.removeItem('khu.' + k); } catch (e) { /* 무시 */ }
      });
    },

    __toTags: toTags
  };

  window.KhuApiError = ApiError;
  window.KhuServerApi = ServerApi;
  window.KhuApi = C.USE_MOCK ? window.KhuMockApi : ServerApi;
  if (!window.KhuApi) throw new Error('목업 모드인데 목업 서버 스크립트가 먼저 로드되지 않았어요');
})();
</script>

const monthGrid = (ym) => {
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const offset = (first.getDay() + 6) % 7; // 월요일 시작
  const start = new Date(y, m - 1, 1 - offset);
  const days = [];
  for (let i = 0; i < 42; i++) days.push(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
  return { y, m, days, from: isoOf(days[0]), to: isoOf(days[41]) };
};
const weekOf = (s) => {
  const d = parseIso(s);
  const offset = (d.getDay() + 6) % 7;
  const start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - offset);
  return Array.from({ length: 7 }, (_, i) => new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
};

R.Calendar = () => {
  const g = monthGrid(S.month);
  const events = S.data.calendar[S.month];
  const byDate = {};
  (events || []).forEach((e) => { (byDate[e.date] = byDate[e.date] || []).push(e); });
  const todayIso = isoOf(TODAY);
  const cells = g.days.map((d, i) => {
    const iso = isoOf(d);
    const out = d.getMonth() + 1 !== g.m;
    const sun = i % 7 === 6;
    const today = iso === todayIso;
    const evs = byDate[iso] || [];
    const ev = evs[0];
    const num = `<span style="width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;${today ? `background:${B};color:#fff;font-weight:700` : out ? 'font-weight:400;color:#7D6E72' : sun ? `font-weight:500;color:${B}` : 'font-weight:500'}">${d.getDate()}</span>`;
    const pill = ev ? `<span class="ell" style="max-width:46px;height:16px;padding:0 3px;border-radius:4px;font-size:10px;font-weight:700;line-height:16px;letter-spacing:-.4px;${isUrgent(ev.date) ? `background:${B};color:#fff` : `background:#F5E8EB;color:${B}`}">${esc(ev.category)}${evs.length > 1 ? ` +${evs.length - 1}` : ''}</span>` : today ? `<span style="font-size:10px;line-height:16px;font-weight:700;color:${B}">오늘</span>` : '';
    const st = 'display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:3px';
    return ev ? `<a href="#" data-act="openEvent" data-id="${esc(ev.noticeId)}" data-ck="${ev.checklist ? 1 : 0}" aria-label="${d.getMonth() + 1}월 ${d.getDate()}일 ${esc(ev.title)} 마감" style="${st}">${num}${pill}</a>` : `<div style="${st}">${num}${pill}</div>`;
  }).join('');
  const upcoming = (events || []).filter((e) => e.date >= todayIso).slice(0, 3);
  const upRow = (e) => `<a href="#" data-act="openEvent" data-id="${esc(e.noticeId)}" data-ck="${e.checklist ? 1 : 0}" class="card" style="height:60px;padding:0 12px 0 8px;border-radius:14px;display:flex;align-items:center;gap:12px">

/* ---------- engine ---------- */
let toastTimer = null;
let searchTimer = null;

function render(anim) {
  const keep = {};
  frame.querySelectorAll('[data-scroll]').forEach((el) => { keep[el.dataset.scroll] = [el.scrollTop, el.scrollLeft]; });
  const active = document.activeElement;
  const focusId = active && frame.contains(active) && active.id ? active.id : null;
  const toastEl = frame.querySelector('.toast');
  frame.innerHTML = R[S.screen]();
  if (toastEl) frame.appendChild(toastEl);
  if (anim) {
    frame.firstElementChild.classList.add('enter');
  } else {
    frame.querySelectorAll('[data-scroll]').forEach((el) => {
      const k = keep[el.dataset.scroll];
      if (k) { el.scrollTop = k[0]; el.scrollLeft = k[1]; }
    });
  }
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus({ preventScroll: true });
      if (el.setSelectionRange && typeof el.value === 'string') { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) { /* 텍스트 칸이 아님 */ } }
    }
  }
  markErrors();
}
function markErrors() {
  if (S.screen !== 'Onboarding') return;
  const miss = S.showErr ? missing() : [];
  frame.querySelectorAll('[data-req]').forEach((el) => el.classList.toggle('err', miss.indexOf(el.dataset.req) >= 0));
  frame.querySelectorAll('input[data-model]').forEach((el) => el.classList.toggle('bad', S.showErr && !el.value.trim()));
  if (S.showErr && miss.indexOf('scores') >= 0) {
    frame.querySelectorAll('[data-req="scores"] input').forEach((el) => {
      const k = el.dataset.model;
      const v = el.value.trim();
      const ok = k === 'credit' ? SCORE_RE.credit.test(v) : SCORE_RE.gpa.test(v) && parseFloat(v) <= 4.5;
      el.classList.toggle('bad', !ok);
    });
  }
  const mj = document.getElementById('f-major');
  if (mj) mj.classList.toggle('bad', S.showErr && !S.form.major);
  const g = document.getElementById('f-year');
  if (g) g.classList.toggle('bad', S.showErr && !S.form.grade);
  const inc = document.getElementById('f-income');
  if (inc) inc.classList.toggle('bad', S.showErr && !S.form.income);
}
function go(name) {
  if (name === S.screen) { refresh(); return; }
  S.hist.push(S.screen);
  if (S.hist.length > 40) S.hist.shift();
  S.screen = name;
  S.gradeOpen = false;
  S.majorOpen = false;
  S.incomeOpen = false;
  render(true);
  refresh();
}
function back() {
  S.screen = S.hist.pop() || 'HomeAI';
  render(true);
  refresh();
}
function toast(msg) {
  const old = frame.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.textContent = msg;
  frame.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 1800);
}
const openUrl = (url, fallback) => {
  if (!url || url === '#' || C.USE_MOCK) { toast(fallback); return; }
  if (/example\.com/.test(url)) { toast('[데모] 공지라 원문 페이지가 없어요'); return; }
  if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'openUrl', url }));
  else window.open(url, '_blank', 'noopener');
};
const invalidate = () => {
  S.data.recs = null; S.data.deadline = null; S.data.notices = null;
  S.data.detail = {}; S.data.calendar = {}; S.data.checklist = {}; S.data.week = {};
};
const patchNotice = (id, fn) => {
  const d = S.data.detail[id];
  if (d) fn(d);
};

async function send(text) {
  const t = (text || '').trim();
  if (!t || S.typing) return;
  S.msgs.push({ role: 'user', text: t });
  S.input = '';
  S.typing = true;
  if (S.screen !== 'Chat') go('Chat'); else render();
  const started = Date.now();
  let msg;
  try {
    const r = await Api.chat(t, S.threadId);
    S.threadId = r.threadId;
    msg = { role: 'assistant', reply: r.reply };
    S.data.threads = null;
  } catch (e) {
    console.error(e);
    msg = { role: 'assistant', reply: { text: '답변을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.', cards: [], actions: [], sources: [] } };
  }
  const left = C.CHAT_TYPING_MIN_MS - (Date.now() - started);
  if (left > 0) await wait(left);
  S.msgs.push(msg);
  S.typing = false;
  if (S.screen === 'Chat') render();
}

const ACT = {
  retry: () => { delete S.err[S.screen]; render(); refresh(); },
  back: () => back(),
  bell: () => toast(S.data.unread ? (C.USE_MOCK ? `새 맞춤 공지 ${S.data.unread}건이 도착했어요` : `저장한 공지 ${S.data.unread}건의 마감이 3일 안에 와요`) : '새 알림이 없어요'),

  /* 정보 입력 */
  gradeToggle: () => { S.gradeOpen = !S.gradeOpen; S.majorOpen = false; S.incomeOpen = false; render(); },
  grade: (d) => { S.form.grade = d.v; S.gradeOpen = false; render(); },
  incomeToggle: () => {
    S.incomeOpen = !S.incomeOpen; S.gradeOpen = false; S.majorOpen = false;
    render();
    const lb = frame.querySelector('[role="listbox"]');
    if (lb) lb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  },
  income: (d) => { S.form.income = d.v; S.incomeOpen = false; render(); },
  majorToggle: () => {
    S.gradeOpen = false;
    S.incomeOpen = false;
    if (!S.form.campus) { S.majorOpen = false; render(); toast('캠퍼스를 먼저 선택해 주세요'); return; }
    S.majorOpen = !S.majorOpen;
    render();
  },
  major: (d) => { S.form.major = d.v; S.majorOpen = false; render(); },
  campus: (d) => {
    S.form.campus = d.v;
    const list = (S.meta && S.meta.majors[d.v]) || [];
    if (list.indexOf(S.form.major) < 0) S.form.major = '';
    render();
  },
  pick: (d) => { const a = S.form.picked; const i = a.indexOf(d.v); if (i >= 0) a.splice(i, 1); else a.push(d.v); render(); },
  finish: async () => {
    if (S.saving) return;
    const miss = missing();
    if (miss.length) {
      S.showErr = true; S.gradeOpen = false; S.majorOpen = false; S.incomeOpen = false;
      render();
      const first = frame.querySelector(`[data-req="${miss[0]}"]`);
      if (first) first.scrollIntoView({ block: 'center', behavior: 'smooth' });
      toast(`필수 정보 ${miss.length}개를 확인해 주세요`);
      return;
    }
    S.saving = true; render();
    try {
      S.profile = await Api.saveProfile(formToProfile(S.form)) || formToProfile(S.form);
      S.showErr = false;
      invalidate();
      S.saving = false;
      go('HomeAI');
    } catch (e) {
      console.error(e);
      S.saving = false; render();
      toast('정보를 저장하지 못했어요. 다시 시도해 주세요');
    }
  },

  /* 목록·필터 */
  elig: () => { S.eligibleOnly = !S.eligibleOnly; render(); load(['deadline']); },
  cat: (d) => { S.cat = d.v; render(); load(['notices']); },
  sort: (d) => { S.sort = d.v; render(); load(['notices']); },
  resetFilter: () => { S.cat = '전체'; S.query = ''; render(); load(['notices']); },
  openNotice: (d) => { S.noticeId = d.id; go('NoticeDetail'); },

  /* 상세 */
  save: async () => {
    const id = S.noticeId;
    const n = S.data.detail[id];
    if (!n) return;
    const on = !n.bookmarked;
    patchNotice(id, (x) => { x.bookmarked = on; });
    render();
    toast(on ? '북마크에 저장했어요' : '북마크를 해제했어요');
    try { await Api.setBookmark(id, on); } catch (e) {
      patchNotice(id, (x) => { x.bookmarked = !on; });
      render();
      toast('북마크를 저장하지 못했어요');
    }
  },
  original: () => { const n = S.data.detail[S.noticeId]; openUrl(n && n.originalUrl, '원문 공지를 새 창에서 열어요'); },
  apply: () => { const n = S.data.detail[S.noticeId]; openUrl(n && n.applyUrl, '신청 페이지로 이동해요'); },
  saveCal: async (d) => {
    const id = d.id || S.noticeId;
    try {
      const ev = await Api.addToCalendar(id);
      invalidate();
      S.month = (ev && ev.date ? ev.date : isoOf(TODAY)).slice(0, 7);
      go('Calendar');
      toast('캘린더에 마감일을 저장했어요');
    } catch (e) {
      console.error(e);
      toast((e && e.status === 422 && e.message) || '캘린더에 저장하지 못했어요');
    }
  },
  noChecklist: () => toast('캘린더에 저장하면 AI가 체크리스트를 만들어요'),
  openChecklist: (d) => { S.checklistId = d.id; go('CalendarChecklist'); },

  /* 캘린더 */
  month: (d) => { S.month = shiftMonth(S.month, Number(d.v)); render(); load(['calendar']); },
  monthView: (d) => { S.month = d.v; go('Calendar'); },
  openEvent: (d) => {
    if (d.ck === '1') { S.checklistId = d.id; go('CalendarChecklist'); }
    else { S.noticeId = d.id; go('NoticeDetail'); }
  },
  check: async (d) => {
    const id = S.checklistId;
    const c = S.data.checklist[id];
    if (!c) return;
    const item = c.items.filter((x) => x.id === d.item)[0];
    if (!item) return;
    item.done = !item.done;
    render();
    try { S.data.checklist[id] = Object.assign(c, await Api.setChecklistItem(id, item.id, item.done)); } catch (e) {
      item.done = !item.done; render(); toast('체크리스트를 저장하지 못했어요');
    }
  },
  alarm: async () => {
    const id = S.checklistId;
    const c = S.data.checklist[id];
    if (!c) return;
    c.alarm.enabled = !c.alarm.enabled;
    render();
    try { await Api.setAlarm(id, c.alarm.enabled); } catch (e) {
      c.alarm.enabled = !c.alarm.enabled; render(); toast('알림 설정을 저장하지 못했어요');
    }
  },

  /* 챗봇 */
  ask: (d) => send(d.v),
  send: () => send(S.input),
  newChat: () => {
    S.threadId = null; S.msgs = []; S.typing = false; S.input = ''; S.threadLoading = false;
    if (S.screen !== 'Chat') go('Chat'); else render();
  },
  openThread: async (d) => {
    S.threadId = d.id; S.msgs = []; S.typing = false; S.threadLoading = true;
    go('Chat');
    try {
      const r = await Api.getThreadMessages(d.id);
      if (S.threadId !== d.id) return;
      S.msgs = r.messages;
    } catch (e) {
      console.error(e);
      toast('대화를 불러오지 못했어요');
    }
    S.threadLoading = false;
    if (S.screen === 'Chat') render();
  }
};

frame.addEventListener('click', (e) => {
  const el = e.target.closest('[data-go],[data-act]');
  if (!el || !frame.contains(el)) {
    if (S.gradeOpen || S.majorOpen || S.incomeOpen) { S.gradeOpen = false; S.majorOpen = false; S.incomeOpen = false; render(); }
    return;
  }
  e.preventDefault();
  if (S.gradeOpen && el.dataset.act !== 'gradeToggle' && el.dataset.act !== 'grade') S.gradeOpen = false;
  if (S.majorOpen && el.dataset.act !== 'majorToggle' && el.dataset.act !== 'major') S.majorOpen = false;
  if (S.incomeOpen && el.dataset.act !== 'incomeToggle' && el.dataset.act !== 'income') S.incomeOpen = false;
  if (el.dataset.go) { go(el.dataset.go); return; }
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset, el);
});
frame.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.model) { S.form[el.dataset.model] = el.value; markErrors(); return; }
  if (el.id === 'nq') {
    S.query = el.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(async () => {
      const screen = S.screen;
      try { await L.notices(); delete S.err.Notices; } catch (err) { S.err.Notices = err.message; }
      if (screen !== 'Notices' || S.screen !== 'Notices') return;
      const box = document.getElementById('nlist');
      if (box) box.innerHTML = noticeList();
      const c = document.getElementById('ncount');
      if (c) c.textContent = S.data.notices ? `${S.data.notices.total}건` : '';
    }, 250);
    return;
  }
  if (el.id === 'chat-in') {
    S.input = el.value;
    const b = document.getElementById('chat-send');
    if (b) b.style.background = S.input.trim() ? B : '#C9A0AC';
  }
});
frame.addEventListener('keydown', (e) => {
  if (e.target.id === 'chat-in' && e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
    e.preventDefault();
    send(e.target.value);
  }
});

document.getElementById('restart').addEventListener('click', () => {
  if (C.USE_MOCK && window.KhuMockApi && window.KhuMockApi.__reset) window.KhuMockApi.__reset();
  S = fresh();
  render(true);
  init();
});

function fit() {
  if (window.innerWidth <= 520) { frame.style.transform = ''; return; }
  const s = Math.min(1.3, (window.innerHeight - 48) / 844, (window.innerWidth - 48) / 390);
  frame.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit);

async function init() {
  const mode = document.getElementById('mode');
  if (mode) mode.textContent = C.USE_MOCK ? '목업 데이터' : `API · ${C.API_BASE}`;
  try {
    const p = await Api.getProfile();
    if (p) { S.profile = p; S.form = profileToForm(p); }
  } catch (e) {
    console.warn('[KHURATION] 프로필을 불러오지 못했어요', e);
  }
}

fit();
render(true);
init();
})();
</script>
</body>
</html>
